# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

after-login-command = []

after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor or window changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Disable macOS "Hide application" (cmd-h)
automatically-unhide-macos-hidden-apps = true

[key-mapping]
    preset = 'qwerty'

# -----------------------------------------------------------------------------
# Window Detection Rules (Floating & Single-Pane Workspace Routing)
# -----------------------------------------------------------------------------
[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'mail'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'settings'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'quicktime'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '1password'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'calculator'
run = 'layout floating'

[[on-window-detected]]
if.window-title-regex-substring = 'Picture-in-Picture|Picture in Picture'
run = 'layout floating'

# Optional: Auto-route Kitty to Workspace 1 (alt-q) so it always lands on your first single-pane space
[[on-window-detected]]
if.app-name-regex-substring = 'kitty'
run = 'move-node-to-workspace 1'

# -----------------------------------------------------------------------------
# Gaps around windows
# -----------------------------------------------------------------------------
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        10
    outer.right =      10

# -----------------------------------------------------------------------------
# 'main' binding mode declaration
# -----------------------------------------------------------------------------
# Your 1-9 Single-Pane Workspace Strip (alt-q .. alt-o):
#   1 (alt-q): Kitty
#   2 (alt-w): Chrome (Work)
#   3 (alt-e): Chat
#   4 (alt-r): Chrome (Mail)
#   5 (alt-t): Chrome (Gemini)
#   6 (alt-y): Tasks
#   7 (alt-u): Workspace 7
#   8 (alt-i): Workspace 8
#   9 (alt-o): Chrome (Personal)
[mode.main.binding]

    # --- Layouts ---
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-g = 'layout floating tiling'

    # --- Focus ---
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # --- Move ---
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # --- Resize ---
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # --- Workspaces (Top Row: 1-9, A | Number Row: B-O) ---
    alt-q = 'workspace 1' # Kitty
    alt-w = 'workspace 2' # Chrome Work
    alt-e = 'workspace 3' # Chat
    alt-r = 'workspace 4' # Chrome Mail
    alt-t = 'workspace 5' # Chrome Gemini
    alt-y = 'workspace 6' # Tasks
    alt-u = 'workspace 7'
    alt-i = 'workspace 8'
    alt-o = 'workspace 9' # Personal Chrome
    alt-p = 'workspace A'
    alt-1 = 'workspace B'
    alt-2 = 'workspace C'
    alt-3 = 'workspace D'
    alt-4 = 'workspace E'
    alt-5 = 'workspace F'
    alt-6 = 'workspace G'
    alt-7 = 'workspace I'
    alt-8 = 'workspace M'
    alt-9 = 'workspace N'
    alt-0 = 'workspace O'

    # --- Move Node to Workspace ---
    alt-shift-q = 'move-node-to-workspace 1'
    alt-shift-w = 'move-node-to-workspace 2'
    alt-shift-e = 'move-node-to-workspace 3'
    alt-shift-r = 'move-node-to-workspace 4'
    alt-shift-t = 'move-node-to-workspace 5'
    alt-shift-y = 'move-node-to-workspace 6'
    alt-shift-u = 'move-node-to-workspace 7'
    alt-shift-i = 'move-node-to-workspace 8'
    alt-shift-o = 'move-node-to-workspace 9'
    alt-shift-p = 'move-node-to-workspace A'
    alt-shift-1 = 'move-node-to-workspace B'
    alt-shift-2 = 'move-node-to-workspace C'
    alt-shift-3 = 'move-node-to-workspace D'
    alt-shift-4 = 'move-node-to-workspace E'
    alt-shift-5 = 'move-node-to-workspace F'
    alt-shift-6 = 'move-node-to-workspace G'
    alt-shift-7 = 'move-node-to-workspace I'
    alt-shift-8 = 'move-node-to-workspace M'
    alt-shift-9 = 'move-node-to-workspace N'
    alt-shift-0 = 'move-node-to-workspace O'

    # --- Quick Bounce / Monitor Switch ---
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # --- Service Mode & App Launchers ---
    alt-shift-semicolon = 'mode service'

    alt-f = 'fullscreen'

    alt-c = 'exec-and-forget open -n "/Applications/Google Chrome.app"'
    alt-a = 'exec-and-forget open -n /Applications/kitty.app'
    alt-x = 'exec-and-forget open -a Finder'

# -----------------------------------------------------------------------------
# 'service' binding mode declaration
# -----------------------------------------------------------------------------
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
