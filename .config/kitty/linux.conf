# Linux-only kitty settings (included from kitty.conf via ${KITTY_OS}.conf)
font_size 11.0

# Forward Cmd+h as Ctrl+h for tmux prefix
map cmd+h send_text all \x08

# Forward Cmd+Left and Cmd+Right as Ctrl+Left and Ctrl+Right for tmux tab cycling
map cmd+left send_text all \x1b[1;5D
map cmd+right send_text all \x1b[1;5C
