unbind C-b
unbind C-q
set -g prefix C-h

# Workspace Switcher: C-h C-h and C-h h (instant single-chord workspace jumping)
bind h display-popup -E -w 85% -h 65% "~/.local/bin/workspace-mux"
bind C-h display-popup -E -w 85% -h 65% "~/.local/bin/workspace-mux"

# Workspace Auto-Toggle: Single Ctrl-Delete / Ctrl-Backspace (or Prefix + Delete/Backspace)
bind BSpace run-shell "~/.local/bin/toggle-workspace"
bind C-BSpace run-shell "~/.local/bin/toggle-workspace"
bind C-? run-shell "~/.local/bin/toggle-workspace"
bind DC run-shell "~/.local/bin/toggle-workspace"
bind C-DC run-shell "~/.local/bin/toggle-workspace"
bind -n C-BSpace run-shell "~/.local/bin/toggle-workspace"
bind -n C-DC run-shell "~/.local/bin/toggle-workspace"

# Direct Workspace Switching by Tab Bar Number (1-9): Ctrl+1..9, Alt+1..9, or Prefix + 1..9
bind -n C-1 run-shell "~/.local/bin/select-workspace-num 1"
bind -n C-2 run-shell "~/.local/bin/select-workspace-num 2"
bind -n C-3 run-shell "~/.local/bin/select-workspace-num 3"
bind -n C-4 run-shell "~/.local/bin/select-workspace-num 4"
bind -n C-5 run-shell "~/.local/bin/select-workspace-num 5"
bind -n C-6 run-shell "~/.local/bin/select-workspace-num 6"
bind -n C-7 run-shell "~/.local/bin/select-workspace-num 7"
bind -n C-8 run-shell "~/.local/bin/select-workspace-num 8"
bind -n C-9 run-shell "~/.local/bin/select-workspace-num 9"
bind -n M-1 run-shell "~/.local/bin/select-workspace-num 1"
bind -n M-2 run-shell "~/.local/bin/select-workspace-num 2"
bind -n M-3 run-shell "~/.local/bin/select-workspace-num 3"
bind -n M-4 run-shell "~/.local/bin/select-workspace-num 4"
bind -n M-5 run-shell "~/.local/bin/select-workspace-num 5"
bind -n M-6 run-shell "~/.local/bin/select-workspace-num 6"
bind -n M-7 run-shell "~/.local/bin/select-workspace-num 7"
bind -n M-8 run-shell "~/.local/bin/select-workspace-num 8"
bind -n M-9 run-shell "~/.local/bin/select-workspace-num 9"
bind 1 run-shell "~/.local/bin/select-workspace-num 1"
bind 2 run-shell "~/.local/bin/select-workspace-num 2"
bind 3 run-shell "~/.local/bin/select-workspace-num 3"
bind 4 run-shell "~/.local/bin/select-workspace-num 4"
bind 5 run-shell "~/.local/bin/select-workspace-num 5"
bind 6 run-shell "~/.local/bin/select-workspace-num 6"
bind 7 run-shell "~/.local/bin/select-workspace-num 7"
bind 8 run-shell "~/.local/bin/select-workspace-num 8"
bind 9 run-shell "~/.local/bin/select-workspace-num 9"
bind C-1 run-shell "~/.local/bin/select-workspace-num 1"
bind C-2 run-shell "~/.local/bin/select-workspace-num 2"
bind C-3 run-shell "~/.local/bin/select-workspace-num 3"
bind C-4 run-shell "~/.local/bin/select-workspace-num 4"
bind C-5 run-shell "~/.local/bin/select-workspace-num 5"
bind C-6 run-shell "~/.local/bin/select-workspace-num 6"
bind C-7 run-shell "~/.local/bin/select-workspace-num 7"
bind C-8 run-shell "~/.local/bin/select-workspace-num 8"
bind C-9 run-shell "~/.local/bin/select-workspace-num 9"

# THE TACTICAL SCRATCHPAD: C-h C-j and C-h j (Toggles open/closed)
bind j if-shell -F '#{==:#{session_name},scratch}' 'detach-client' 'run-shell "~/.local/bin/toggle-scratch"'
bind C-j if-shell -F '#{==:#{session_name},scratch}' 'detach-client' 'run-shell "~/.local/bin/toggle-scratch"'

# AI & Workspace Toolkits: Dual-bound for sticky Ctrl (hold Ctrl continuously)
bind l display-popup -E -w 80% -h 50% "~/.local/bin/tab-mux"
bind C-l display-popup -E -w 80% -h 50% "~/.local/bin/tab-mux"

bind c display-popup -E -w 85% -h 65% "~/.local/bin/copy-ai-code"
bind C-c display-popup -E -w 85% -h 65% "~/.local/bin/copy-ai-code"

bind g display-popup -E -w 80% -h 60% "~/.local/bin/group-mux"
bind C-g display-popup -E -w 80% -h 60% "~/.local/bin/group-mux"

# THE TASK OIL INTERFACE
bind t display-popup -EE -w 90% -h 85% "~/.local/bin/task-oil"
bind C-t display-popup -EE -w 90% -h 85% "~/.local/bin/task-oil"


# THE FUZZY LINK OPENER
bind u display-popup -E -w 80% -h 60% "~/.local/bin/url-mux"
bind C-u display-popup -E -w 80% -h 60% "~/.local/bin/url-mux"

# Style the actual split-pane separators
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'

# Ultimate Organization: Physically group and sort actual tabs by directory
bind r run-shell "~/.local/bin/sort-tmux"
bind R run-shell "~/.local/bin/sort-tmux"
bind C-r run-shell "~/.local/bin/sort-tmux"

# Automatically group and color-code windows on lifecycle events
set-hook -g after-select-window 'run-shell -b "~/.local/bin/track-active-window \"#{window_id}\""'
set-hook -g session-window-changed 'run-shell -b "~/.local/bin/track-active-window \"#{window_id}\""'
set-hook -g after-kill-pane 'run-shell "~/.local/bin/sort-tmux"'
set-hook -g pane-exited 'run-shell "~/.local/bin/sort-tmux"'
set-hook -g window-unlinked 'run-shell "~/.local/bin/sort-tmux"'
set-hook -g client-attached 'run-shell "~/.local/bin/sort-tmux"'


# Split Panes gracefully
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Seamlessly hop between panes using Alt + Arrow Keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g bell-action any
set -g allow-passthrough on

# Create a new window next to current window in the active workspace
bind -n C-t run-shell "~/.local/bin/smart-new-tab"

# Open New Tab Popup: defaults to ~, fuzzy-picks MRU/zoxide dirs (extensible via ~/.local/bin/new-tab-mux-hook.sh)
bind -n C-n display-popup -E -w 80% -h 60% "~/.local/bin/new-tab-mux"
bind n display-popup -E -w 80% -h 60% "~/.local/bin/new-tab-mux"
bind C-n display-popup -E -w 80% -h 60% "~/.local/bin/new-tab-mux"

# Cycle strictly within the active workspace using Ctrl-Left / Ctrl-Right
bind -n C-Left run-shell "~/.local/bin/cycle-dir-windows prev"
bind -n C-Right run-shell "~/.local/bin/cycle-dir-windows next"

bind -n C-w run-shell "~/.local/bin/smart-kill-tab"
bind -n C-v copy-mode
bind v copy-mode

set -g default-terminal "screen-256color"
set -as terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ',*:Ms=\E]52;c;%p2%s\7'
set -as terminal-features ",xterm-kitty:RGB:sync:clipboard,xterm*:RGB:sync:clipboard"

# Window numbers start at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Eliminate latency
set -s escape-time 0
set-option -g repeat-time 1000

setw -g mode-keys vi
set -g status-keys vi

bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi V     send-keys -X select-line
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "~/.local/bin/osc52_copy.sh"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.local/bin/osc52_copy.sh"
bind-key -T copy-mode-vi F12   send-keys -X copy-pipe-and-cancel "~/.local/bin/osc52_copy.sh"
bind-key -T copy-mode    y     send-keys -X copy-pipe-and-cancel "~/.local/bin/osc52_copy.sh"
bind-key -T copy-mode    F12   send-keys -X copy-pipe-and-cancel "~/.local/bin/osc52_copy.sh"
bind-key -T root         F12   run-shell "true"
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode    MouseDragEnd1Pane

# Double-click word & Triple-click line: copy via osc52_copy.sh + show toast popup!
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.25 \; send-keys -X copy-pipe-and-cancel "~/.local/bin/osc52_copy.sh"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.25 \; send-keys -X copy-pipe-and-cancel "~/.local/bin/osc52_copy.sh"
bind-key -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.25 \; send-keys -X copy-pipe-and-cancel "~/.local/bin/osc52_copy.sh"
bind-key -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.25 \; send-keys -X copy-pipe-and-cancel "~/.local/bin/osc52_copy.sh"
bind-key -T root         DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H \; send-keys -X select-word \; run-shell -d 0.25 \; send-keys -X copy-pipe-and-cancel ~/.local/bin/osc52_copy.sh"
bind-key -T root         TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H \; send-keys -X select-line \; run-shell -d 0.25 \; send-keys -X copy-pipe-and-cancel ~/.local/bin/osc52_copy.sh"

# Smooth 1-line-per-tick trackpad scrolling (instead of jumping 5 lines at a time)
bind-key -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e \; send-keys -X -N 1 scroll-up"
bind-key -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down
bind-key -T copy-mode    WheelUpPane   send-keys -X -N 1 scroll-up
bind-key -T copy-mode    WheelDownPane send-keys -X -N 1 scroll-down

set -g mode-style "bg=#45475a,fg=#cdd6f4,bold"

# Set status bar to top
set -g status-position top
set-option -g status 2
set-option -g status-format[1] ""

set -g status-fg "#cdd6f4" 
set -g mouse on
set-option -g history-limit 50000
set-option -g status-style 'bg=default'

set-option -g message-style 'bg=default,fg=#89b4fa,bold'
set-option -g message-command-style 'bg=default,fg=#89b4fa,bold'
set-option -g status-left ""

set-option -g status-interval 2
set-option -g status-right-length 150 
set-option -g status-right '#(~/.local/bin/kube-status-tmux "#{pane_id}")#[fg=#cdd6f4]%H:%M '

# Commands whose windows get the ":AI" badge (regex). Override in ~/.tmux.conf.local.
set -g @ai_cmd_regex '^(claude|gemini|codex|aider|opencode|cli)$'

set-option -g window-status-separator ""
set-option -g window-status-format '#{?#{@is_group_start},#[fg=#{@group_color}]#[bold][#{?#{@workspace_name},#{@workspace_name},~}] ,}#[fg=#{@group_color}] #{?#{@group_index},#{@group_index},#I}#{?#{m/r:#{@ai_cmd_regex},#{pane_current_command}},:AI,#{?#{m:nvim,#{pane_current_command}},:nvim,}}#{?#{window_bell_flag},#[fg=#{@group_color}]#[bold] ✦,} #{?#{@is_group_sep},#[fg=#45475a]│ ,}'
set-option -g window-status-current-format '#{?#{@is_group_start},#[fg=#{@group_color}]#[bold][#{?#{@workspace_name},#{@workspace_name},~}] ,}#[bg=#{@group_color}]#[fg=#11111b]#[bold][ #{?#{@group_index},#{@group_index},#I}#{?#{m/r:#{@ai_cmd_regex},#{pane_current_command}},:AI,#{?#{m:nvim,#{pane_current_command}},:nvim,}}#{?#{window_bell_flag}, ✦,} ]#[default]#{?#{@is_group_sep},#[fg=#45475a]│ ,}'

set-window-option -g monitor-bell on
set-window-option -g monitor-activity off
set-option -g visual-bell off
set-option -g visual-activity off

set-option -g window-status-bell-style 'none'
set-option -g window-status-activity-style 'none'

set-option -g set-clipboard on
set-option -s set-clipboard on

# Plugins (TPM). Install TPM with:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then press prefix + I inside tmux. The theme is hand-rolled (Catppuccin Mocha hex
# colours above), so no theme plugin is loaded.
set -g @plugin 'tmux-plugins/tpm'

# Load Local / machine-specific configuration (Ignored by Git)
source-file -q ~/.tmux.conf.local

# Keep this line at the very bottom
if-shell "[ -x ~/.tmux/plugins/tpm/tpm ]" "run '~/.tmux/plugins/tpm/tpm'"
